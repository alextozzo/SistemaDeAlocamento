<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Alocamento - Dashboard PCP</title>
    <style>
        :root {
            /* Paleta Dark Mode Randon */
            --randon-red: #e30613;
            --bg-page: #121212;
            --bg-card: #1e1e1e;
            --bg-card-header: #2a2a2a;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
            --border-dark: #333333;
            --alert-red: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            color: var(--text-main);
            padding-bottom: 50px; 
        }

        /* Cabeçalho branco mantido para preservar a leitura perfeita da logo */
        header {
            background-color: #ffffff;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 5px solid var(--randon-red);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        header img {
            height: 50px;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .dashboard-header {
            max-width: 1400px;
            margin: 25px auto 15px;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-header h2 {
            margin: 0;
            color: var(--text-main);
            font-size: 20px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #cccccc;
            font-weight: 600;
            background: #252525;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid var(--border-dark);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .dot-pulse {
            width: 8px;
            height: 8px;
            background-color: #28a745;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 15px 30px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: 8px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 1px solid #3a3a3a;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border-color: #555;
        }

        .card-header {
            background-color: var(--bg-card-header);
            padding: 14px 15px;
            font-weight: 800;
            font-size: 18px;
            color: #ffffff;
            text-transform: uppercase;
            border-bottom: 2px solid #111;
            letter-spacing: 0.5px;
        }

        .card-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-dark);
        }

        .info-row:last-of-type {
            border-bottom: none;
        }

        .label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .value {
            font-weight: 700;
            font-size: 16px;
            color: #ffffff;
            background: #2a2a2a;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #444;
            min-width: 35px;
            text-align: center;
        }

        .alert-value {
            color: var(--alert-red);
            border-color: rgba(227, 6, 19, 0.5);
            background: rgba(227, 6, 19, 0.1);
        }

        .obs-box {
            background-color: #181818;
            border: 1px solid var(--border-dark);
            border-radius: 6px;
            padding: 12px;
            margin-top: 5px;
            min-height: 45px;
        }

        .obs-box .label {
            font-size: 11px;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 6px;
            border-bottom: none;
        }

        .obs-text {
            font-size: 14px;
            font-weight: 600;
            color: #dddddd;
            display: block;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .alert-obs {
            border-color: var(--randon-red);
            background-color: rgba(227, 6, 19, 0.08);
        }

        .alert-obs .obs-text {
            color: var(--alert-red);
        }

        footer {
            position: fixed;
            bottom: 12px;
            right: 20px;
            z-index: 9999;
            pointer-events: none;
        }

        /* Assinatura ajustada: Mais nítida que a anterior, mas elegante e discreta no fundo preto */
        .footer-text {
            color: #777777; 
            font-size: 12px;
            font-weight: 500;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <header>
        <img src="image_ebd0f4.png" alt="Logo Randon Triel-HT" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend', '<h2 style=\'margin:0;\'>RANDON TRIEL-HT</h2>');">
        <h1>Sistema de Alocamento</h1>
    </header>

    <div class="dashboard-header">
        <h2>Visão de Disponibilidade (PCP)</h2>
        <div class="status-indicator">
            <div class="dot-pulse"></div>
            <span id="lastUpdate">Sincronizando dados...</span>
        </div>
    </div>

    <div class="grid-container" id="cardsContainer">
        <!-- O conteúdo será injetado aqui -->
    </div>

    <footer>
        <p class="footer-text">Desenvolvido por Alex Tozzo</p>
    </footer>

    <script>
        const setoresPadrao = [
            "Estamparia", "PRM", "PMRT", "TANQ", "CALADRA", 
            "SILO", "CT", "BASE", "ESPECIAIS", "MOF", "PINTURA", "JATO"
        ];

        let lastRenderedData = "";

        function gerarDadosPadrao() {
            return setoresPadrao.map(setor => ({
                setor: setor, 
                real: 0, 
                fisico: 0, 
                obs: "", 
                custo: 0 
            }));
        }

        function formatarMoeda(valor) {
            const numero = parseFloat(valor) || 0;
            return numero.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function renderDashboard() {
            const rawData = localStorage.getItem('randonEfetivoData');
            
            if (rawData === lastRenderedData && rawData !== null) return;
            
            let data = [];

            if (rawData) {
                try {
                    data = JSON.parse(rawData);
                } catch (e) {
                    console.error("Erro no JSON. Restaurando padrão.");
                    data = gerarDadosPadrao();
                }
            } else {
                data = gerarDadosPadrao();
            }

            const container = document.getElementById('cardsContainer');
            container.innerHTML = ''; 

            data.forEach(row => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const real = parseInt(row.real) || 0;
                const fisico = parseInt(row.fisico) || 0;
                const discrepancia = real !== fisico;
                const temObs = row.obs && row.obs.trim() !== "";
                
                const alertClass = discrepancia ? 'alert-value' : '';
                
                let obsExibida = temObs ? row.obs : "-";
                let obsStyleClass = "obs-box";
                
                if (discrepancia && !temObs) {
                    obsExibida = "Justificativa pendente";
                    obsStyleClass = "obs-box alert-obs";
                }

                card.innerHTML = `
                    <div class="card-header">${row.setor || 'DESCONHECIDO'}</div>
                    <div class="card-body">
                        <div class="info-row">
                            <span class="label">👥 Efetivo Real:</span>
                            <span class="value ${alertClass}">${real}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">👤 Efetivo Físico:</span>
                            <span class="value ${alertClass}">${fisico}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">💵 Custos:</span>
                            <span class="value">${formatarMoeda(row.custo)}</span>
                        </div>
                        
                        <div class="${obsStyleClass}">
                            <span class="label">OBS:</span>
                            <span class="obs-text">${obsExibida}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            lastRenderedData = rawData;
            
            const now = new Date();
            document.getElementById('lastUpdate').innerText = `Sincronizado: ${now.toLocaleTimeString('pt-BR')}`;
        }

        renderDashboard();
        setInterval(renderDashboard, 1000);

    </script>
</body>
</html>
